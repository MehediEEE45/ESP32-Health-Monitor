[build]
  # Directory to change to before starting a build.
  base = "web"
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build. 
  # This is relative to the base directory.
  publish = "dist"
  
  # The build command your project needs to run
  command = "npm run build"

[[redirects]]
  # Redirect any routes back to index.html (useful if you ever add React Router later)
  from = "/*"
  to = "/index.html"
  status = 200
